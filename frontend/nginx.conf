# PULSE web tier: serves the static UI, proxies /api to the backend, applies edge rate limits and security headers.
# Put a TLS-terminating reverse proxy / load balancer in front (see docs/SETUP.md); add HSTS there or uncomment below.
server_tokens off;

# Authoritative rate limits (shared by all API workers). The app has its own per-process limits as defence in depth.
limit_req_zone $binary_remote_addr zone=api_all:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=60r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

map $request_method $is_write { default 0; POST 1; PUT 1; PATCH 1; DELETE 1; }
map $is_write $write_key { 0 ""; 1 $binary_remote_addr; }
limit_req_zone $write_key zone=api_write_m:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;          # CSV imports are capped at ~2 MB by the API as well
    client_body_timeout 15s;
    limit_conn perip 40;

    # --- security headers (CSP forbids inline scripts; fonts are the only third-party origin) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # enable when served over HTTPS here

    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /api/v1/auth/login {
        limit_req zone=api_login burst=5 nodelay;
        include /etc/nginx/pulse-proxy.inc;
        proxy_pass http://api:8000;
    }

    location /api/ {
        limit_req zone=api_all burst=60 nodelay;
        limit_req zone=api_write_m burst=30 nodelay;
        include /etc/nginx/pulse-proxy.inc;
        proxy_pass http://api:8000;
        proxy_read_timeout 60s;
    }

    location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public"; add_header X-Content-Type-Options "nosniff" always; add_header Content-Security-Policy "default-src 'none'" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; add_header Referrer-Policy "no-referrer" always; }
}
